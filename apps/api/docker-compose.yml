version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: nc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: neighborhood_connect
      POSTGRES_USER: nc_user
      POSTGRES_PASSWORD: nc_password
    volumes:
      - nc_postgres_data:/var/lib/postgresql/data

volumes:
  nc_postgres_data:
